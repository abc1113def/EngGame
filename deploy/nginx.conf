# Пример server-блока nginx для игры (статический сайт).
# Скопируйте в /etc/nginx/sites-available/a320 и сделайте ссылку в sites-enabled.
# Нагрузка минимальна: nginx отдаёт ~600 КБ файлов, расход памяти ~5–10 МБ.

server {
    listen 80;
    listen [::]:80;
    server_name _;            # замените на свой домен или IP

    root /var/www/a320;       # сюда копируется содержимое папки dist/
    index index.html;

    # сжатие — игра станет ~150 КБ по сети
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # файлы с хешем в имени можно кешировать надолго
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
